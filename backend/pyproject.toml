[project]
name = "twinsight"
version = "0.1.0"
description = "TwinSight — plataforma open source de visualización y modelado de gemelos digitales"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "jdluques" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "neo4j>=5.25",
    "aiomqtt>=2.3",
    "lark>=1.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "paho-mqtt>=2.1",
    "amqtt>=0.11",
]

[project.scripts]
twinsight = "twinsight.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinsight"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "neo4j: requires a running Neo4j instance (set TWINSIGHT_NEO4J_URI)",
    "integration: end-to-end tests touching the full stack",
]
