<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 800 500" width="800" height="500">
  <title>Plano de demostración — Aulas PI3</title>
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a202c">TwinSight — Piso de aulas (demo PI3)</text>
    <g>
      <rect x="40" y="70" width="720" height="360" fill="none" stroke="#2d3748" stroke-width="4"/>
      <line x1="400" y1="70" x2="400" y2="430" stroke="#2d3748" stroke-width="4"/>
      <line x1="60" y1="430" x2="110" y2="430" stroke="#ffffff" stroke-width="6"/>
      <line x1="440" y1="430" x2="490" y2="430" stroke="#ffffff" stroke-width="6"/>
    </g>
    <g id="zona-aulaA">
      <rect x="60" y="90" width="300" height="320" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="210.0" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Aula A</text>
    </g>
    <g id="sensor-co2-aulaA"
       data-dt-element="SensorCO2_AulaA"
       data-dt-channel="gemelo/aula-a/co2:co2_ppm">
      <circle cx="115" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="115" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">CO2</text>
      <text x="115" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">co2</text>
    </g>
    <g id="sensor-temp-aulaA"
       data-dt-element="SensorTemp_AulaA"
       data-dt-channel="gemelo/aula-a/temp:temp_c">
      <circle cx="210" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="210" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">T</text>
      <text x="210" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">temp</text>
    </g>
    <g id="sensor-ruido-aulaA"
       data-dt-element="SensorRuido_AulaA"
       data-dt-channel="gemelo/aula-a/ruido:spl_db">
      <circle cx="305" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="305" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">dB</text>
      <text x="305" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">ruido</text>
    </g>
    <g id="sensor-luz-aulaA"
       data-dt-element="SensorLuz_AulaA"
       data-dt-channel="gemelo/aula-a/luz:lux">
      <circle cx="115" cy="310" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="115" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">LUX</text>
      <text x="115" y="344" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">luz</text>
    </g>
    <g id="sensor-ocupacion-aulaA"
       data-dt-element="SensorOcupacion_AulaA"
       data-dt-channel="gemelo/aula-a/ocupacion:count">
      <circle cx="210" cy="310" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="210" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">OCU</text>
      <text x="210" y="344" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">ocupacion</text>
    </g>
    <g id="rejilla-vent-aulaA"
       data-dt-element="RejillaVent_AulaA">
      <g inkscape:label="estado:nominal">
        <rect x="290" y="350" width="44" height="44" rx="4" fill="none" stroke="#9aa0a6" stroke-width="2"/>
        <line x1="290" y1="350" x2="334" y2="394" stroke="#9aa0a6" stroke-width="2"/>
        <line x1="334" y1="350" x2="290" y2="394" stroke="#9aa0a6" stroke-width="2"/>
        <line x1="312.0" y1="350" x2="312.0" y2="394" stroke="#9aa0a6" stroke-width="2"/>
        <line x1="290" y1="372.0" x2="334" y2="372.0" stroke="#9aa0a6" stroke-width="2"/>
      </g>
      <g inkscape:label="estado:forzada">
        <rect x="290" y="350" width="44" height="44" rx="4" fill="none" stroke="#1a73e8" stroke-width="2"/>
        <line x1="290" y1="350" x2="334" y2="394" stroke="#1a73e8" stroke-width="2"/>
        <line x1="334" y1="350" x2="290" y2="394" stroke="#1a73e8" stroke-width="2"/>
        <line x1="312.0" y1="350" x2="312.0" y2="394" stroke="#1a73e8" stroke-width="2"/>
        <line x1="290" y1="372.0" x2="334" y2="372.0" stroke="#1a73e8" stroke-width="2"/>
      </g>
      <g inkscape:label="estado:alarma">
        <rect x="290" y="350" width="44" height="44" rx="4" fill="none" stroke="#d93025" stroke-width="2"/>
        <line x1="290" y1="350" x2="334" y2="394" stroke="#d93025" stroke-width="2"/>
        <line x1="334" y1="350" x2="290" y2="394" stroke="#d93025" stroke-width="2"/>
        <line x1="312.0" y1="350" x2="312.0" y2="394" stroke="#d93025" stroke-width="2"/>
        <line x1="290" y1="372.0" x2="334" y2="372.0" stroke="#d93025" stroke-width="2"/>
        <text x="312.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#d93025">&#9888;</text>
      </g>
    </g>
    <g id="zona-aulaB">
      <rect x="440" y="90" width="300" height="320" rx="6" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="590.0" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2d3748">Aula B</text>
    </g>
    <g id="sensor-co2-aulaB"
       data-dt-element="SensorCO2_AulaB"
       data-dt-channel="gemelo/aula-b/co2:co2_ppm">
      <circle cx="495" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="495" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">CO2</text>
      <text x="495" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">co2</text>
    </g>
    <g id="sensor-temp-aulaB"
       data-dt-element="SensorTemp_AulaB"
       data-dt-channel="gemelo/aula-b/temp:temp_c">
      <circle cx="590" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="590" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">T</text>
      <text x="590" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">temp</text>
    </g>
    <g id="sensor-ruido-aulaB"
       data-dt-element="SensorRuido_AulaB"
       data-dt-channel="gemelo/aula-b/ruido:spl_db">
      <circle cx="685" cy="160" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="685" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">dB</text>
      <text x="685" y="194" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">ruido</text>
    </g>
    <g id="sensor-luz-aulaB"
       data-dt-element="SensorLuz_AulaB"
       data-dt-channel="gemelo/aula-b/luz:lux">
      <circle cx="495" cy="310" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="495" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">LUX</text>
      <text x="495" y="344" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">luz</text>
    </g>
    <g id="sensor-ocupacion-aulaB"
       data-dt-element="SensorOcupacion_AulaB"
       data-dt-channel="gemelo/aula-b/ocupacion:count">
      <circle cx="590" cy="310" r="20" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="590" y="314" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">OCU</text>
      <text x="590" y="344" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#444">ocupacion</text>
    </g>
</svg>
